name: Notify Parent Repo
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          COMMENT_DATABASE_URL: sqlite+aiosqlite:///./test/test.db
        run: python -m pytest

      - name: Send Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TOKEN_FOR_ALL_MICROSERVICES }}
          repository: MicroServices-SocialApp/All_MicroServices
          event-type: microservice_updated
          client-payload: '{"service_name": "Comment-API", "lowercase_name": "comment-api", "sha": "${{ github.sha }}"}'